name: CI

on:
  push:
    branches: [main, "build/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run tests with enforced coverage
        run: |
          coverage erase
          coverage run -m pytest -q
          coverage report -m

  security:
    name: Static and dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint and scan source
        run: |
          ruff check app tests scripts
          bandit -q -r app scripts
          python -m compileall -q app scripts
      - name: Audit production and development locks
        run: |
          pip-audit --strict -r requirements.lock
          pip-audit --strict -r requirements-dev.lock

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start hardened Compose stack
        run: docker compose up -d --build
      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:7777/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Run and independently verify a mission
        run: |
          set -euo pipefail
          response="$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"task":"CI container smoke test"}' \
            http://127.0.0.1:7777/api/missions)"
          mission_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["mission_id"])' <<<"${response}")"
          curl --fail --silent \
            "http://127.0.0.1:7777/api/missions/${mission_id}/verify" \
            | python -c 'import json,sys; result=json.load(sys.stdin); assert result["valid"], result'
      - name: Show container status on failure
        if: failure()
        run: docker compose ps && docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
