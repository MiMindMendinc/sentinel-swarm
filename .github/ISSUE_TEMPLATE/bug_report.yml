name: Bug report
description: Report a reproducible problem in Sentinel Swarm
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Sentinel Swarm more reliable. Please do not include secrets or sensitive target data.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.1 or commit SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact behavior you observed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
