<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel Swarm v0.1.0 architecture</title>
  <desc id="desc">Browser UI connects to FastAPI over HTTP and WebSocket. FastAPI calls a deterministic mission engine which coordinates five observable roles and writes to an isolated mission workspace containing events.jsonl and report.md.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#07111b"/><stop offset="1" stop-color="#0b1724"/></linearGradient>
    <linearGradient id="node" x1="0" x2="1"><stop offset="0" stop-color="#10263a"/><stop offset="1" stop-color="#12314b"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#55d8ff"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <text x="64" y="62" fill="#f3f7fb" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Sentinel Swarm v0.1.0 — Evidence-First Architecture</text>
  <text x="64" y="92" fill="#8ea7bb" font-family="Inter,Arial,sans-serif" font-size="15">Local deterministic mission flow · no network scanning · no arbitrary shell · no autonomous exploitation</text>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="64" y="150" width="190" height="94" rx="18" fill="url(#node)" stroke="#1f6686"/>
    <text x="159" y="187" text-anchor="middle" fill="#66e3ff" font-size="17" font-weight="700">WEB UI</text>
    <text x="159" y="215" text-anchor="middle" fill="#b8c8d5" font-size="13">Mission console</text>

    <rect x="330" y="150" width="210" height="94" rx="18" fill="url(#node)" stroke="#1f6686"/>
    <text x="435" y="187" text-anchor="middle" fill="#66e3ff" font-size="17" font-weight="700">FASTAPI</text>
    <text x="435" y="215" text-anchor="middle" fill="#b8c8d5" font-size="13">HTTP + WebSocket</text>

    <rect x="616" y="132" width="240" height="130" rx="18" fill="url(#node)" stroke="#2b8ba8"/>
    <text x="736" y="170" text-anchor="middle" fill="#66e3ff" font-size="17" font-weight="700">MISSION ENGINE</text>
    <text x="736" y="198" text-anchor="middle" fill="#b8c8d5" font-size="13">Deterministic orchestration</text>
    <text x="736" y="223" text-anchor="middle" fill="#7ee6a7" font-size="12">Evidence-first contract</text>

    <rect x="936" y="132" width="280" height="130" rx="18" fill="url(#node)" stroke="#2a7c61"/>
    <text x="1076" y="170" text-anchor="middle" fill="#80f0b0" font-size="17" font-weight="700">ISOLATED WORKSPACE</text>
    <text x="1076" y="199" text-anchor="middle" fill="#b8c8d5" font-size="13">Patched sshd_config copy</text>
    <text x="1076" y="223" text-anchor="middle" fill="#b8c8d5" font-size="13">events.jsonl · report.md</text>
  </g>

  <g stroke="#55d8ff" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M254 197 H324"/><path d="M540 197 H610"/><path d="M856 197 H930"/>
  </g>
  <text x="290" y="178" text-anchor="middle" fill="#8ea7bb" font-family="Inter,Arial,sans-serif" font-size="11">HTTP / WS</text>

  <g font-family="Inter,Arial,sans-serif" font-size="12">
    <rect x="590" y="310" width="124" height="44" rx="12" fill="#0d2535" stroke="#1f6686"/><text x="652" y="338" text-anchor="middle" fill="#d8f5ff">RECON</text>
    <rect x="723" y="310" width="150" height="44" rx="12" fill="#0d2535" stroke="#1f6686"/><text x="798" y="338" text-anchor="middle" fill="#d8f5ff">EXPLOIT-ANALYSIS</text>
    <rect x="882" y="310" width="136" height="44" rx="12" fill="#0d2535" stroke="#1f6686"/><text x="950" y="338" text-anchor="middle" fill="#d8f5ff">THREAT-MODEL</text>
    <rect x="1027" y="310" width="132" height="44" rx="12" fill="#0d2535" stroke="#1f6686"/><text x="1093" y="338" text-anchor="middle" fill="#d8f5ff">SECURE-CODING</text>
    <rect x="1168" y="310" width="94" height="44" rx="12" fill="#0d2535" stroke="#1f6686"/><text x="1215" y="330" text-anchor="middle" fill="#d8f5ff">REPORT-</text><text x="1215" y="345" text-anchor="middle" fill="#d8f5ff">WRITER</text>
  </g>
  <path d="M736 262 V288 H652 V304 M736 288 H1215 V304" stroke="#376a83" stroke-width="2" fill="none"/>
</svg>
