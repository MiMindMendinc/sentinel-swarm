services:
  sentinel:
    build: .
    ports:
      - "7777:7777"
    volumes:
      - sentinel-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7777/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  sentinel-data:
