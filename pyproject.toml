[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-swarm"
version = "0.1.0"
description = "Evidence-first local multi-agent cybersecurity lab"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "pydantic>=2.8,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
